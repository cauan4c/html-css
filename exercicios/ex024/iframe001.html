<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            width: 300px;
            height: 500px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Estudando o uso de iframe</h1>
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com/" frameborder="0">
            Acesse o site do <a href="https://www.cursoemvideo.com/">curso em video</a>
        </iframe>
    para aprender a programar</p>
</body>
</html>
