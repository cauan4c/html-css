<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
            /*display: inline;*/
            background-color: lightseagreen;
            width: 250px;
            height: 250px; 
            border: 10px double black;
            padding: 10px;
            outline: 5px dashed salmon;
            margin: 10px 15px;
        }
        a {
            background-color: lightcoral;
            text-decoration: none;
            color: white;
            border-width: 3px;
            border-style: dashed; 
            border-color: black;
            padding-top: 5px;
            padding-right: 5px;
            padding-bottom: 5px;
            padding-left: 5px;           
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level mas, <a href="#">links são exemplos de inline</a> Vamos ver como tudo isso funciona.</p>
</body>
</html>
