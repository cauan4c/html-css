<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            background-color: burlywood;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            text-align: center;
        }
        table{
            border-collapse: collapse;
            text-align: center;
            padding: 10px;
            width: 300px;
            height: 200px;
            margin: auto;
        }

        td{
              border: solid 1px black;
        }
        tr:nth-child(2){
            background-color: white;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de células</h1>
    <table>
        <tr>
            <td>A</td>
            <td>A</td>
            <td>A</td>
        </tr>
        <tr>
            <td rowspan="2">A</td>
            <td>A</td>
            <td>A</td>
        </tr>
        <tr>
            <td colspan="2">A</td>
        </tr>
    </table>
</body>
</html>
