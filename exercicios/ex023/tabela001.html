<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        *{
            margin: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
               background-color: burlywood;
               color: white;
        }

        table{
            width:400px;
            border-collapse: collapse;
            margin: auto;
        }

        td{
            border: 1px solid black;
            text-align: center;
        }

        .linha{
            background-color: rgb(255, 241, 219);
            color: black;
        }

        h1{
            text-align: center;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr class= "linha">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr class= "linha">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
    </table>
</body>
</html>
