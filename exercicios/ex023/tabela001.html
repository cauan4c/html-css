<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        *{
            margin: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
               background-color: burlywood;
               color: white;
        }

        table{
            width:400px;
            height: 400px;
            border-collapse: collapse;
            margin: auto;
        }

        td{
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

        .linha{
            background-color: rgb(255, 241, 219);
            color: black;
        }

        .superior{
            vertical-align: top;
        }
        .inferior{
            vertical-align: bottom;
        }

        .numero{
            text-align: right;
        }

        h1{
            text-align: center;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr class= "linha">
            <td class="superior">A1</td>
            <td class="superior">B1</td>
            <td class="superior">C1</td>
        </tr>
        <tr>
            <td class="numero">A2</td>
            <td class="numero">B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr class= "linha">
            <td class="inferior">A3</td>
            <td class="inferior">B3</td>
            <td class="inferior">C3</td>
        </tr>
    </table>
</body>
</html>
