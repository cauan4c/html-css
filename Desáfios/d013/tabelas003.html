<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: burlywood;
        }

        table{
            text-align: center;
            width: 500px;
            height: 100px;
            border-collapse: collapse;
            margin: auto;
        }
        td, th{
            border: solid 1px black;
        }

        .zebrado{
            background-color: white;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col" rowspan="2" class="zebrado">Área</th>
                <th scope="col" rowspan="2" class="zebrado">Disciplinas</th>
                <th colspan="2" scope="colgroup" class="zebrado">Notas</th>
                <th scope="col" rowspan="22" class="zebrado">Média</th>
            </tr>

            <tr>
                <td class="zebrado">Nota 1</td>
                <td class="zebrado">Nota 2</td>
            </tr>
        </thead>


        <tbody>
        <tr>   
            <th rowspan="4" scope="rowgroup">Exatas</th>
            <td>Mátematica</td>
            <td>0</td>
            <td>0</td>
            <td>0</td>
        </tr>

        <tr>
            <td>Física</td>
            <td>0</td>
            <td>0</td>
            <td>0</td>
        </tr>

        <tr>
            <td>Química</td>
            <td>0</td>
            <td>0</td>
            <td>0</td>
        </tr>

        <tr>
            <td>Biologia</td>
            <td>0</td>
            <td>0</td>
            <td>0</td>
        </tr>
        <tr>
            <th colspan="4" scope="row" class="zebrado">Média de Exatas</th>
            <td class="zebrado">0</td>
        </tr>
        <tr>   
            <th rowspan="2" scope="rowgroup">Humanas</th>
            <td>História</td>
            <td>0</td>
            <td>0</td>
            <td>0</td>
        </tr>
        <tr>
            <td>Geoografia</td>
            <td>0</td>
            <td>0</td>
            <td>0</td>
        </tr>

        <tr>
            <th colspan="4" scope="row" class="zebrado">Média de Humanas</th>
            <td class="zebrado">0</td>
        </tr>

        </tbody>

        <tfoot>

        </tfoot>
    </table>
</body>
</html>
